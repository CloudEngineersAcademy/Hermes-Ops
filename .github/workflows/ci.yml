# Hermes Ops — CI/CD Workflows
#
# Continuous Integration pipelines for the Hermes Ops repository.
#
# Workflows:
#   1. CI — runs on every push and PR: lint, secret scan, saver test
#   2. Scheduled — runs the transcript saver on schedule (mirror of local cron)
#   3. Release — builds and tags a release when a release branch is merged
#
# All workflows use the GITHUB_TOKEN provided by GitHub Actions (no secrets
# needed for read-only operations). The PAT for pushing is stored as a
# repository secret: HERMES_GITHUB_TOKEN.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # allow manual trigger

jobs:
  lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy

      - name: Run flake8 (syntax & style checks)
        run: |
          flake8 scripts/ \
            --max-line-length=120 \
            --ignore=E501,W503,E203 \
            --exclude=.git,__pycache__,.env

      - name: Run black (formatting check)
        run: |
          black --check --diff scripts/

      - name: Run isort (import order check)
        run: |
          isort --check --diff scripts/

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git-leaks

      - name: Install gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.1_linux_x64.tar.gz
          chmod +x gitleaks

      - name: Run gitleaks (full history scan)
        run: |
          ./gitleaks detect --source . --verbose --report-format json --report-path gitleaks-report.json || true

      - name: Upload gitleaks report (if any findings)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7

      - name: Fail if secrets found
        run: |
          if [ -f gitleaks-report.json ]; then
            findings=$(python3 -c "import json; d=json.load(open('gitleaks-report.json')); print(len(d.get('falsePositiveCases', d.get('leaks', []))))" 2>/dev/null || echo "0")
            if [ "$findings" -gt 0 ]; then
              echo "FAIL: $findings potential secret(s) found in repository history."
              echo "Review the gitleaks-report.json artifact."
              exit 1
            fi
          fi
          echo "No secrets detected."

  saver-test:
    name: Saver Integration Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Create test state DB (mock)
        run: |
          python3 -c "
          import sqlite3, json, datetime, os
          db_path = '/tmp/test_state.db'
          if os.path.exists(db_path):
              os.remove(db_path)
          conn = sqlite3.connect(db_path)
          conn.row_factory = sqlite3.Row
          cur = conn.cursor()
          cur.execute('''CREATE TABLE sessions (
              id TEXT PRIMARY KEY,
              title TEXT,
              display_name TEXT,
              source TEXT,
              started_at REAL,
              ended_at REAL,
              message_count INTEGER,
              cwd TEXT,
              git_branch TEXT,
              git_repo_root TEXT
          )''')
          cur.execute('''CREATE TABLE messages (
              id INTEGER PRIMARY KEY,
              session_id TEXT,
              role TEXT,
              content TEXT,
              timestamp REAL,
              token_count INTEGER,
              tool_calls TEXT,
              tool_name TEXT,
              display_kind TEXT
          )''')
          now = datetime.datetime.now().timestamp()
          session_id = 'test_session_' + str(int(now))
          cur.execute(
              'INSERT INTO sessions (id, title, source, started_at, ended_at, message_count, cwd) VALUES (?, ?, ?, ?, ?, ?, ?)',
              (session_id, 'CI Test Session', 'ci', now - 3600, None, 2, '/tmp')
          )
          cur.execute(
              'INSERT INTO messages (session_id, role, content, timestamp, token_count, display_kind) VALUES (?, ?, ?, ?, ?, ?)',
              (session_id, 'user', 'Hello CI world', now - 1800, 5, '')
          )
          cur.execute(
              'INSERT INTO messages (session_id, role, content, timestamp, token_count, display_kind) VALUES (?, ?, ?, ?, ?, ?)',
              (session_id, 'assistant', 'Hello! This is a test response from CI.', now - 900, 8, '')
          )
          conn.commit()
          conn.close()
          print(f'Created test DB with session: {session_id}')
          "

      - name: Run saver in test mode
        env:
          GITHUB_TOKEN: fake-test-token-not-real
          HERMES_STATE_DB: /tmp/test_state.db
          HERMES_OPS_DIR: ${{ github.workspace }}
        run: |
          # Override REMOTE_URL in the script to avoid real push
          python3 -c "
          import os, sys, importlib.util
          # Patch the remote URL before importing
          os.environ['GITHUB_TOKEN'] = 'fake-token'
          spec = importlib.util.spec_from_file_location('save_session', 'scripts/save_session.py')
          mod = importlib.util.module_from_spec(spec)
          # Override the push function to no-op in test
          original_push = None
          def mock_push(commit_msg):
              print(f'[MOCK PUSH] Would push: {commit_msg}')
              return True
          mod.git_commit_and_push = mock_push
          spec.loader.exec_module(mod)
          mod.save_all_active_sessions(on_demand=True)
          print('Saver test completed successfully.')
          "

  workflow-summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [lint, secret-scan, saver-test]
    steps:
      - name: Report status
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Lint: passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Secret scan: passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Saver test: passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All checks passed. Ready to merge." >> $GITHUB_STEP_SUMMARY
